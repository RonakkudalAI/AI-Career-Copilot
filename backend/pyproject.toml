[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "career-copilot-api"
version = "1.0.0"
# 3.11–3.13 recommended. Official crewai requires Python <3.14.
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5.3,<7",
  "python-docx>=1.1,<2",
  "reportlab>=4.2,<5",
  "PyJWT[crypto]>=2.10,<3",
  "langchain-openai>=0.3,<1"
]

[project.optional-dependencies]
dev = ["ruff>=0.9,<1"]
# Optional layout-aware PDF extraction (heavier). Install: pip install -e ".[docling]"
docling = ["docling>=2.0,<3"]
# Official CrewAI package (requires Python >=3.10,<3.14). On Python 3.14+ the
# built-in CrewAI-compatible orchestrator is used automatically.
# Install only on supported Python: pip install -e ".[crewai]"
crewai = ["crewai>=0.80,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
