<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f1e8" />
    <meta
      name="description"
      content="Career Copilot — private resume analysis, mock interviews, and job matching in one workspace."
    />
    <meta property="og:title" content="Career Copilot" />
    <meta
      property="og:description"
      content="Analyze resumes with evidence, practice interviews, and track career progress in one private workspace."
    />
    <meta property="og:image" content="https://careercopilotai.vercel.app/brand/career-copilot-light.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Career Copilot" />
    <meta
      name="twitter:description"
      content="Analyze resumes with evidence, practice interviews, and track career progress in one private workspace."
    />
    <meta name="twitter:image" content="https://careercopilotai.vercel.app/brand/career-copilot-light.png" />
    <link rel="icon" href="/brand/career-copilot-light.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("career-copilot-theme");
          const preference = stored === "dark" ? "dark" : "light";
          const resolved = preference;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
    <title>Career Copilot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
